[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xianyu-dev-operator"
version = "0.2.0"
description = "Local Xianyu customer-service and developer business operating platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "langchain>=1.3.18,<1.4",
  "langgraph>=1.2.11,<1.3",
  "mcp>=1.13,<2",
  "msgpack>=1.1,<2",
  "pillow>=11,<13",
  "pillow-heif>=1,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
